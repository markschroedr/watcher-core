[project]
name = "watcher"
version = "0.1.0"
description = "Generic watcher primitive: watch an input stream or check in on a schedule, filter with a fast model, surface findings to agents."
requires-python = ">=3.12"
dependencies = [
    "openai>=2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "ruamel-yaml>=0.18",
]

[project.scripts]
watcher = "watcher.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
