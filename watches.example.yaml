# Definitions only. Runtime progress and findings live in watcher.db beside this file.
# Built-ins: eco, fast, thorough. sol is for escalation or confirmation.
watches:
  - name: demo-log
    enabled: true
    generation: 1
    preset: eco
    source:
      type: file
      path: demo.log
      # from_start: true
      # start_inode: 12345
      # start_position: 0
    criteria:
      - id: error-event
        text: >
          An error, failure, crash, or exception that a developer should investigate.
          Routine warnings, successful retries, and successful requests do not count.
    actions:
      - name: record
        kind: record
        description: Record any matched criterion for later review.
      - name: notify
        kind: notify
        description: Show a desktop notification for findings that need attention now.
        repeat_every_seconds: 300
    # escalate: sol
    # A command action requires confirm: eco (or another preset).
    # Command actions use fixed argv; finding JSON arrives on stdin.
    # confirm: thorough
    cadence: {every_seconds: 300, quiet_seconds: 10}
    window_max_chars: 65536
    oneshot: false
    max_cost_usd: 1.00
    labels: {app: demo}

# Add ordinary presets here, or in a watches.d/*.yaml fragment.
