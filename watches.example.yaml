log_dir: runs

# `watcher presets` prints the canonical preset profiles and cadence.
profiles:
  eco:
    model: gpt-6-luna
    api: responses
    reasoning_effort: medium
    service_tier: flex
    price_input_per_mtok: 0.05
    price_cached_input_per_mtok: 0.005
    price_output_per_mtok: 0.25
  fast:
    model: gpt-6-luna
    api: responses
    reasoning_effort: low
    service_tier: priority
    price_input_per_mtok: 0.20
    price_cached_input_per_mtok: 0.02
    price_output_per_mtok: 1.00
  thorough:
    model: gpt-6-luna
    api: responses
    reasoning_effort: high
    service_tier: flex
    price_input_per_mtok: 0.05
    price_cached_input_per_mtok: 0.005
    price_output_per_mtok: 0.25

criteria:
  - id: error-event
    description: >
      A line reports an error, failure, crash, or exception that a developer
      would want to know about. Routine warnings, retries that succeed, and
      successful requests do not count.

actions:
  - name: record
    description: Record a finding so the user can review it later. Use for any matched criterion.
    kind: log
  - name: notify
    description: Show a desktop notification. Use only for findings that need attention now.
    kind: notify

watches:
  - name: demo-log
    enabled: true
    source: {type: file, path: runs/demo.log}
    cadence: {preset: interval, every_seconds: 300}
    profile: eco
    criteria: [error-event]
    actions: [record, notify]
    window_max_chars: 65536
